name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - v4

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install Dependencies
        run: npm ci
      - name: Build Quartz
        run: npx quartz build
      - name: Merge standalone sites
        run: |
          if [ -d standalone-sites ]; then
            find standalone-sites -mindepth 1 -maxdepth 1 -type d -print | while IFS= read -r site_dir; do
              site_name="$(basename "$site_dir")"
              echo "Merging standalone site: ${site_name}"
              mkdir -p "public/${site_name}"
              rsync -av --delete "${site_dir}/" "public/${site_name}/"
            done
          else
            echo "No standalone-sites directory found; skipping merge."
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
